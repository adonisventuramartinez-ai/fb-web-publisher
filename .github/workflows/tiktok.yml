name: TikTok worker

# Lo despierta la app (Vercel) con workflow_dispatch cada vez que importas enlaces.
# Además corre solo cada 30 min como RED DE SEGURIDAD: si el despacho falló (token de
# GitHub caducado, GitHub caído…) los enlaces pendientes se procesan igual.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# Una sola ejecución a la vez; si llegan más, queda una en espera (procesa todo lo pendiente).
concurrency:
  group: tiktok-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Paso barato (segundos): si no hay nada pendiente, termina sin instalar nada
      # (así la ejecución programada casi no gasta minutos de Actions).
      - name: ¿Hay importaciones pendientes?
        id: hay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::Faltan los secrets SUPABASE_URL / SUPABASE_SERVICE_KEY (Settings → Secrets and variables → Actions). Si no usas la pestaña TikTok, ignora este aviso."
            echo "hay=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUPABASE_URL="${SUPABASE_URL%/}"; SUPABASE_URL="${SUPABASE_URL%/rest/v1}"
          if [[ "$SUPABASE_SERVICE_KEY" == sb_publishable_* ]]; then
            echo "::error::SUPABASE_SERVICE_KEY es la llave PÚBLICA (sb_publishable_…). Usa la SECRETA (sb_secret_…)."
            exit 1
          fi
          if [[ "$SUPABASE_SERVICE_KEY" == sb_* ]]; then
            AUTH=(-H "apikey: $SUPABASE_SERVICE_KEY")
          else
            AUTH=(-H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          fi
          RESP=$(curl -sS --fail-with-body -G "${SUPABASE_URL}/rest/v1/importaciones" \
            --data-urlencode "select=id" \
            --data-urlencode "estado=in.(pendiente,procesando)" \
            --data-urlencode "limit=1" "${AUTH[@]}")
          echo "Respuesta: $RESP"
          if [ "$RESP" = "[]" ]; then echo "hay=false" >> "$GITHUB_OUTPUT"; else echo "hay=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.hay.outputs.hay == 'true'
      - uses: actions/setup-python@v5
        if: steps.hay.outputs.hay == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Asegurar ffmpeg (el worker lo usa para dejar el video en MP4/H.264 y sacar la miniatura)
        if: steps.hay.outputs.hay == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: "Instalar yt-dlp (siempre la última: TikTok cambia a menudo) y Chromium para sssinstagram"
        if: steps.hay.outputs.hay == 'true'
        run: |
          pip install -U -r worker/requirements.txt
          # Solo se usa para Instagram; si falla, el worker usa yt-dlp.
          python -m playwright install --with-deps chromium || echo "::warning::No se pudo instalar Chromium: Instagram usará solo yt-dlp."
      - name: Procesar importaciones pendientes
        if: steps.hay.outputs.hay == 'true'
        run: python worker/tiktok_worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SECRET_KEY }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          SIN_MARCA: ${{ vars.SIN_MARCA }}
